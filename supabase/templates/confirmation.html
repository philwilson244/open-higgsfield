<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f4f1;color:#181818;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #deded8;border-radius:16px;padding:32px">
            <tr><td><h1 style="margin:0 0 12px;font-size:26px">Confirm your Wilson Creative Studio account</h1></td></tr>
            <tr><td><p style="margin:0 0 24px;line-height:1.55;color:#555">Confirm your email address to finish creating your account.</p></td></tr>
            <tr>
              <td>
                <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/ads" style="display:inline-block;background:#181818;color:#ffffff;text-decoration:none;border-radius:10px;padding:13px 20px;font-weight:700">Confirm email address</a>
              </td>
            </tr>
            <tr><td><p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#777">If you didn’t create this account, you can ignore this email.</p></td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
